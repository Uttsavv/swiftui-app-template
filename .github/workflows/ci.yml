name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Design system tests
        run: swift test --package-path Packages/DesignSystem

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test app
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "Using simulator: $SIM"
          NAME=$(basename *.xcodeproj .xcodeproj)
          xcodebuild test \
            -project "$NAME.xcodeproj" -scheme "$NAME" \
            -destination "platform=iOS Simulator,name=$SIM" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | xcbeautify

      - name: Show accessibility issues
        if: failure()
        run: grep "Accessibility issue:" xcodebuild.log || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
